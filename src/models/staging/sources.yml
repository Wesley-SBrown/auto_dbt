version: 2

sources:
  - name: holley_raw
    database: HOLLEY_DB
    schema: RAW 
    description: "Raw semi-structured automotive product payloads"
    freshness:
      warn_after: {count: 24, period: hour}
      error_after: {count: 72, period: hour}
    loaded_at_field: _LOADED_AT
    tables:
      - name: raw_events
        description: "2mil+ automotive JSON records, stored in RAW_DATA VARIANT with load metadata"
        columns:
          - name: raw_data
            description: "Raw JSON payload containing, product title, price, rating, etc"
            tests:
              - not_null
          - name: _source_file
            description: "Source filename"
          - name: _loaded_at
            description: "Timestamp when record was loaded in"